<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeridianOS Logo Preview</title>
<style>
  body {
    margin: 0;
    padding: 60px;
    font-family: Inter, 'Segoe UI', system-ui, sans-serif;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  h2 { color: #0f172a; margin: 0 0 16px; font-weight: 500; letter-spacing: -.3px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .card.dark { background: #0a1128; }
  .card.dark h2 { color: #f8fafc; }
  .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  img { display: block; }
</style>
</head>
<body>
  <h1 style="font-weight:600;color:#0f172a;margin:0 0 8px;">MeridianOS — Brand Assets</h1>

  <div class="card">
    <h2>Icon Only</h2>
    <img src="meridianos-icon.svg" width="128" height="128" alt="MeridianOS icon">
    <span class="label">64×64 viewBox — meridianos-icon.svg</span>
  </div>

  <div class="card">
    <h2>Full Logo (Light)</h2>
    <img src="meridianos-logo.svg" width="320" height="64" alt="MeridianOS logo">
    <span class="label">320×64 — meridianos-logo.svg</span>
  </div>

  <div class="card dark">
    <h2>Full Logo (Dark)</h2>
    <img src="meridianos-logo-dark.svg" width="320" height="64" alt="MeridianOS logo dark">
    <span class="label">320×64 — meridianos-logo-dark.svg</span>
  </div>
</body>
</html>
