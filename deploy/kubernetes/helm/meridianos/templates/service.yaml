{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridianos.componentName" (dict "context" . "component" "gateway") }}
  labels:
    {{- include "meridianos.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridianos.componentSelectorLabels" (dict "context" . "component" "gateway") | nindent 4 }}
{{- end }}
---
{{- if .Values.daemon.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridianos.componentName" (dict "context" . "component" "daemon") }}
  labels:
    {{- include "meridianos.componentLabels" (dict "context" . "component" "daemon") | nindent 4 }}
spec:
  type: {{ .Values.daemon.service.type }}
  clusterIP: None
  ports:
    - port: {{ .Values.daemon.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridianos.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 4 }}
{{- end }}
---
{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridianos.componentName" (dict "context" . "component" "dashboard") }}
  labels:
    {{- include "meridianos.componentLabels" (dict "context" . "component" "dashboard") | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meridianos.componentSelectorLabels" (dict "context" . "component" "dashboard") | nindent 4 }}
{{- end }}
