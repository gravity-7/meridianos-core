{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meridianos.fullname" . }}-secrets
  labels:
    {{- include "meridianos.labels" . | nindent 4 }}
type: Opaque
data:
  # Raw file content for .ai/auth/jwt-secret (see scripts/generate-jwt-secret.mjs) — auth/jwt.mjs
  # reads this file verbatim, no key=value parsing. Required: an empty/default secret would sign
  # tokens with a predictable key. Generate one with:
  #   node -e "console.log(require('node:crypto').randomBytes(64).toString('hex'))"
  jwt-secret: {{ required "secrets.jwtSecret is required — generate a 64-byte hex secret (see scripts/generate-jwt-secret.mjs) and pass it via --set secrets.jwtSecret=... or --set-file" .Values.secrets.jwtSecret | b64enc | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | b64enc | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | b64enc | quote }}
  {{- range $key, $value := .Values.secrets.providerKeys }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
