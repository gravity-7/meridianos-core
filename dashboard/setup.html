<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeridianOS Setup</title>
<style>
:root {
  --surface-2: #ffffff; --surface-1: #f8fafc; --surface-0: #f1f5f9;
  --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
  --border: rgba(15, 23, 42, 0.08); --text-accent: #2563eb; --fill-accent: #3b82f6;
  --text-danger: #dc2626; --bg-danger: #fef2f2; --text-success: #16a34a; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-2: #1e293b; --surface-1: #0f172a; --surface-0: #020617;
    --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #64748b;
    --border: rgba(255,255,255,0.08); --text-accent: #60a5fa; --fill-accent: #3b82f6;
  }
}
body { font-family: -apple-system, system-ui, sans-serif; background: var(--surface-0); color: var(--text-primary); margin: 0; padding: 24px; }
.wizard { max-width: 560px; margin: 40px auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
h1 { font-size: 18px; margin: 0 0 4px; }
.step-label { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-secondary); }
input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1); color: var(--text-primary); font-size: 14px; margin-bottom: 16px; }
button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--fill-accent); color: white; cursor: pointer; font-size: 13px; }
button.secondary { background: var(--surface-1); color: var(--text-primary); }
.row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.error { color: var(--text-danger); font-size: 13px; margin-top: 8px; }
.hint { font-size: 11px; color: var(--text-muted); margin-top: -10px; margin-bottom: 14px; }
pre { background: var(--surface-1); padding: 10px; border-radius: 6px; font-size: 11px; overflow: auto; max-height: 200px; }
</style>
</head>
<body>
<div class="wizard" id="wizard"></div>
<script>
const AIOS_TOKEN = "__AIOS_TOKEN__";
const SETUP_SESSION_ID = "__SETUP_SESSION_ID__";
(function () {
  const _fetch = window.fetch;
  window.fetch = (input, init = {}) => {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.startsWith('/')) { init = { ...init, headers: { ...(init.headers || {}), 'x-aios-token': AIOS_TOKEN } }; }
    return _fetch(input, init);
  };
})();

const STORAGE_KEY = 'meridian.setupWizard.state.v1';
const STEPS = ['welcome', 'agents', 'providers', 'budget', 'review', 'done'];
const FALLBACK_STATE = { step: 0, tenantName: 'My Tenant', agentsRaw: 'builder,reviewer', monthlyBudgetUsd: 100, providerId: '', modelId: '' };

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || typeof saved !== 'object') return { ...FALLBACK_STATE };
    return {
      step: Number.isInteger(saved.step) ? saved.step : FALLBACK_STATE.step,
      tenantName: typeof saved.tenantName === 'string' ? saved.tenantName : FALLBACK_STATE.tenantName,
      agentsRaw: typeof saved.agentsRaw === 'string' ? saved.agentsRaw : FALLBACK_STATE.agentsRaw,
      monthlyBudgetUsd: Number(saved.monthlyBudgetUsd) > 0 ? Number(saved.monthlyBudgetUsd) : FALLBACK_STATE.monthlyBudgetUsd,
      providerId: typeof saved.providerId === 'string' ? saved.providerId : '',
      modelId: typeof saved.modelId === 'string' ? saved.modelId : '',
    };
  } catch { return { ...FALLBACK_STATE }; }
}
function saveState(s) {
  // Credentials, validation identifiers, and setup-session identifiers are intentionally absent.
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    step: s.step, tenantName: s.tenantName, agentsRaw: s.agentsRaw, monthlyBudgetUsd: s.monthlyBudgetUsd,
    providerId: s.providerId, modelId: s.modelId,
  }));
}
function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
}

let state = loadState();
let detected = null;
const transient = { sessionId: null, validationId: null, reviewId: null };

async function init() {
  try {
    const res = await fetch('/api/setup/status');
    detected = await res.json();
    transient.sessionId = SETUP_SESSION_ID || null;
    if (detected.exists) return renderExistingWarning();
    if (!detected.ok || !Array.isArray(detected.providers) || !transient.sessionId) return renderUnavailable();
    render();
  } catch { renderUnavailable(); }
}
function renderExistingWarning() {
  document.getElementById('wizard').innerHTML = `
    <h1>Existing configuration found</h1>
    <div class="step-label">This directory already contains a setup target.</div>
    <p style="font-size:13px">For safety, first-time setup never overwrites an existing installation.</p>
    <div class="row"><button class="secondary" onclick="window.location.href='/'">Back to dashboard</button></div>`;
}
function renderUnavailable() {
  document.getElementById('wizard').innerHTML = `<h1>Setup is unavailable</h1><div class="error" role="alert">The setup status could not be loaded safely. Reload and try again.</div>`;
}
function syntheticBanner() {
  return detected?.synthetic ? '<div class="hint" role="status">Synthetic and disposable lab environment.</div>' : '';
}
function agents() { return state.agentsRaw.split(',').map((item) => item.trim()).filter(Boolean); }
function render() {
  const step = STEPS[state.step];
  if (step === 'welcome') return renderWelcome();
  if (step === 'agents') return renderAgents();
  if (step === 'providers') return renderProviders();
  if (step === 'budget') return renderBudget();
  if (step === 'review') return renderReview();
  if (step === 'done') return renderDone();
  state.step = 0; renderWelcome();
}
function renderWelcome() {
  document.getElementById('wizard').innerHTML = `
    <h1>MeridianOS Setup</h1>${syntheticBanner()}
    <div class="step-label">Step 1 of 5 — Installation name</div>
    <label for="tenantName">What should we call this installation?</label>
    <input id="tenantName" value="${escapeHtml(state.tenantName)}">
    <div class="row"><button onclick="nextFrom('welcome')">Next</button></div>`;
}
function renderAgents() {
  document.getElementById('wizard').innerHTML = `
    <h1>Agent roster</h1><div class="step-label">Step 2 of 5</div>
    <label for="agentsRaw">Comma-separated agent names</label>
    <input id="agentsRaw" value="${escapeHtml(state.agentsRaw)}">
    <div class="hint">These are the identities that will pick up and work tasks.</div>
    <div class="row"><button class="secondary" onclick="back()">Back</button><button onclick="nextFrom('agents')">Next</button></div>`;
}
function renderProviders() {
  const providers = detected.providers;
  if (!providers.length) {
    document.getElementById('wizard').innerHTML = `<h1>Provider connection</h1><div class="error" role="alert">No registered BYOK provider is available for setup.</div>`;
    return;
  }
  const provider = providers.find((entry) => entry.id === state.providerId) || providers[0];
  state.providerId = provider.id;
  state.modelId = provider.models.includes(state.modelId) ? state.modelId : provider.models[0];
  const providerOptions = providers.map((entry) => `<option value="${escapeHtml(entry.id)}"${entry.id === state.providerId ? ' selected' : ''}>${escapeHtml(entry.displayName)}</option>`).join('');
  const modelOptions = provider.models.map((model) => `<option value="${escapeHtml(model)}"${model === state.modelId ? ' selected' : ''}>${escapeHtml(model)}</option>`).join('');
  const status = transient.validationId ? '<div class="hint" role="status">Connection verified. Continue to budget.</div>' : '<div class="hint">A key is sent once for validation and is never saved in this browser.</div>';
  document.getElementById('wizard').innerHTML = `
    <h1>Provider connection</h1>${syntheticBanner()}
    <div class="step-label">Step 3 of 5 — select and validate a registered BYOK route</div>
    <label for="providerId">Provider</label><select id="providerId" onchange="providerChanged()">${providerOptions}</select>
    <label for="modelId">Model</label><select id="modelId" onchange="modelChanged()">${modelOptions}</select>
    <label for="providerKey">Provider key for ${escapeHtml(provider.keyEnv)}</label>
    <input id="providerKey" type="password" autocomplete="off" spellcheck="false">
    ${status}<div class="error" id="validationError" role="alert" aria-live="polite"></div>
    <div class="row"><button class="secondary" onclick="back()">Back</button><button class="secondary" onclick="validateProvider()">Validate connection</button><button onclick="nextFrom('providers')">Continue</button></div>`;
}
function providerChanged() {
  void revokeValidation();
  state.providerId = document.getElementById('providerId').value; state.modelId = ''; saveState(state); renderProviders();
}
function modelChanged() {
  void revokeValidation();
  state.modelId = document.getElementById('modelId').value; saveState(state); renderProviders();
}
async function revokeValidation() {
  const validationId = transient.validationId;
  transient.validationId = null;
  transient.reviewId = null;
  if (!validationId || !transient.sessionId) return;
  try {
    await fetch('/api/setup/provider-validation/revoke', {
      method: 'POST', headers: { 'content-type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ validationId, sessionId: transient.sessionId }),
    });
  } catch { /* Browser state is already clear; expiry is the final server-side safety net. */ }
}
async function validateProvider() {
  const input = document.getElementById('providerKey');
  const error = document.getElementById('validationError');
  const secret = input.value;
  input.value = '';
  await revokeValidation();
  if (!secret) { error.textContent = 'Enter a provider key to validate this route.'; return; }
  try {
    const res = await fetch('/api/setup/provider-validation', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ providerId: state.providerId, modelId: state.modelId, secret, sessionId: transient.sessionId }),
    });
    const body = await res.json();
    if (!body.ok) { error.textContent = body.error || 'Connection could not be verified. Try again.'; return; }
    transient.validationId = body.validation.id;
    renderProviders();
  } catch { error.textContent = 'Connection could not be verified. Try again.'; }
}
function renderBudget() {
  document.getElementById('wizard').innerHTML = `
    <h1>Budget</h1><div class="step-label">Step 4 of 5</div>
    <label for="monthlyBudgetUsd">Monthly budget (USD)</label>
    <input id="monthlyBudgetUsd" type="number" min="1" value="${escapeHtml(state.monthlyBudgetUsd)}">
    <div class="hint">Converted into weekly / 5-hour token caps on the review step.</div>
    <div class="row"><button class="secondary" onclick="back()">Back</button><button onclick="nextFrom('budget')">Next</button></div>`;
}
async function renderReview() {
  const el = document.getElementById('wizard');
  el.innerHTML = `<h1>Review</h1><div class="step-label">Step 5 of 5</div><div class="hint">Computing…</div>`;
  try {
    const res = await fetch('/api/setup/plan', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ tenantName: state.tenantName, agents: agents(), providerId: state.providerId, modelId: state.modelId, monthlyBudgetUsd: Number(state.monthlyBudgetUsd), validationId: transient.validationId, sessionId: transient.sessionId }),
    });
    const body = await res.json();
    if (!body.ok) throw new Error(body.error || 'Review unavailable.');
    const review = body.review;
    transient.reviewId = review.id;
    el.innerHTML = `
      <h1>Review</h1><div class="step-label">Step 5 of 5</div>
      <p style="font-size:13px">Installation: <b>${escapeHtml(review.installationName)}</b><br>Agents: <b>${escapeHtml(review.agents.join(', '))}</b><br>Route: <b>${escapeHtml(review.route.displayName)} / ${escapeHtml(review.route.modelId)}</b><br>Budget: <b>$${state.monthlyBudgetUsd}/month</b> → ${review.budget.weeklyTokenCap.toLocaleString()} tokens/week (${review.budget.token_cap_5h.toLocaleString()}/5h)</p>
      <pre>${review.files.map((file) => `${file.name} — ${file.description}`).join('\n')}</pre>
      <div class="hint">Reviewing writes nothing. Only the final confirmation writes setup files.</div>
      <div class="error" id="commitError" role="alert" aria-live="polite"></div>
      <div class="row"><button class="secondary" onclick="back()">Back</button><button onclick="commit()">Confirm and write files</button></div>`;
  } catch (error) {
    el.innerHTML = `<h1>Review</h1><div class="error" role="alert">${escapeHtml(error.message)}</div><div class="row"><button class="secondary" onclick="back()">Back</button></div>`;
  }
}
async function commit() {
  try {
    const res = await fetch('/api/setup/commit', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ tenantName: state.tenantName, agents: agents(), providerId: state.providerId, modelId: state.modelId, monthlyBudgetUsd: Number(state.monthlyBudgetUsd), validationId: transient.validationId, reviewId: transient.reviewId, sessionId: transient.sessionId, confirmed: true }),
    });
    const body = await res.json();
    if (!body.ok) throw new Error(body.error || 'Setup could not be committed.');
    transient.validationId = null; transient.reviewId = null; state.step = STEPS.indexOf('done'); saveState(state); render();
  } catch (error) { document.getElementById('commitError').textContent = error.message; }
}
function renderDone() {
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('wizard').innerHTML = `<h1>Setup complete</h1><p style="font-size:13px">Your installation is ready.</p><div class="row"><button onclick="window.location.href='/'">Go to dashboard</button></div>`;
}
function nextFrom(step) {
  if (step === 'welcome') state.tenantName = document.getElementById('tenantName').value.trim() || 'My Tenant';
  if (step === 'agents') { const value = document.getElementById('agentsRaw').value.trim(); if (!value) { alert('At least one agent is required.'); return; } state.agentsRaw = value; }
  if (step === 'providers' && !transient.validationId) { document.getElementById('validationError').textContent = 'Validate the selected provider and model before continuing.'; return; }
  if (step === 'budget') { const value = Number(document.getElementById('monthlyBudgetUsd').value); if (!(value > 0)) { alert('Budget must be a positive number.'); return; } state.monthlyBudgetUsd = value; }
  state.step += 1; saveState(state); render();
}
async function back() {
  if (state.step >= STEPS.indexOf('providers')) await revokeValidation();
  state.step = Math.max(0, state.step - 1); saveState(state); render();
}

window.addEventListener('pagehide', () => { void revokeValidation(); });

init();
</script>
</body>
</html>
