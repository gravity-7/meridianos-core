# MeridianOS core — L2 packaging (Docker Compose)
#
# Two services from ONE image:
#   gateway — standalone sidecar (default `docker compose up`)
#   daemon  — full autonomous loop (uncomment + mount .ai/tenant.yaml)
#
# Tenant-agnostic by construction: no tenant paths, no tenant config, and no secret literals are
# hardcoded here. Every knob is an env var with a name only — the value is supplied by the
# operator at `docker compose up` time (a `.env` file next to this compose file, or the shell
# environment), never committed.

services:
  gateway:
    build: .
    image: meridianos-core-gateway
    ports:
      - "${GATEWAY_PORT:-8787}:8787"
    environment:
      # BYO-key: name the provider key env var(s) your policy/route table references (see
      # providers.mjs `keyEnv`) so Compose forwards them from the host/`.env` into the container.
      # Never put a literal key value in this file — only the NAME is declared, the VALUE comes
      # from your shell env or an untracked `.env` file.
      - DEEPSEEK_KEY
      - ANTHROPIC_API_KEY
      - OPENROUTER_KEY
    volumes:
      # Ledger persistence (SQLite) — survives container restarts/recreates.
      - gateway-ledger:/app/.ai/gateway
      # Optional: mount your own policy.yaml read-only to enforce real budget caps instead of the
      # CLI's empty default policy. Uncomment and point at your tenant's policy file:
      # - ./policy.yaml:/app/policy.yaml:ro
    command:
      - "--port=8787"
      - "--tenant=${GATEWAY_TENANT:-default}"
      - "--ledger=/app/.ai/gateway/ledger.db"
      # Uncomment once the policy.yaml volume above is mounted:
      # - "--policy=/app/policy.yaml"
      # Uncomment to register one default run at boot (see gateway/README.md flags):
      # - "--provider=deepseek"
      # - "--model=deepseek-chat"
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # daemon — the full autonomous loop (scheduler.mjs via daemon-entry.mjs).
  # ---------------------------------------------------------------------------------------------
  # Uncomment this service and create a `.ai/tenant.yaml` in your repo root to run the full daemon
  # from the SAME image — no custom Dockerfile or FROM-derived build needed.
  #
  # The daemon auto-discovers its tenant from:
  #   1. $AIOS_TENANT_CONFIG (env var pointing at a YAML file), or
  #   2. .ai/tenant.yaml in the repo root (mounted below)
  #
  # daemon:
  #   build: .
  #   image: meridianos-core-gateway
  #   entrypoint: ["node", "daemon-entry.mjs"]
  #   ports:
  #     - "${DASHBOARD_PORT:-4317}:4317"
  #   environment:
  #     - AIOS_ROOT=/tenant
  #     - AIOS_DASHBOARD_PORT=4317
  #     - AIOS_DASH_TOKEN
  #     - AIOS_ESCALATION_WEBHOOK
  #     - DEEPSEEK_KEY
  #     - ANTHROPIC_API_KEY
  #     - OPENROUTER_KEY
  #   volumes:
  #     - ./:/tenant:ro           # mounts .ai/tenant.yaml + policy.yaml
  #     - daemon-state:/tenant/.ai/state
  #     - daemon-gateway:/tenant/.ai/gateway
  #   restart: unless-stopped

volumes:
  gateway-ledger:
  daemon-state:
  daemon-gateway:
