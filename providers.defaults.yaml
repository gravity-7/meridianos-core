# Built-in provider defaults — lowest-priority source in the three-source merge.
# Override any field in policy.yaml (highest) or .ai/providers.yaml (middle).
# Removing a provider from a higher source hides it from the resolved list.
# Generated: 2026-07-28 — MeridianOS Provider & Model Agnosticism (003)

providers:
  anthropic:
    name: anthropic
    displayName: Anthropic
    wire: anthropic
    # No baseUrl/keyEnv here — native anthropic has neither (see providers.mjs BUILTIN_PROVIDERS:
    # "null = inject nothing; use the CLI's own login", "no BYO key for the native harness"). This
    # layer only overrides fields it actually sets (deepMergeProviders), so omitting them here lets
    # the code-level `null` defaults win rather than silently turning anthropic into a BYO-key HTTP
    # provider — a prior version of this file set both explicitly, which broke providerKeyPresent()
    # or any provider using the native (keyEnv: null) contract.
    auth:
      mode: env
      headerName: x-api-key
    features:
      supportsStreaming: true
      supportsToolUse: true
      supportsVision: true
      supportsCaching: true
      supportsThinking: true
      supportsJsonMode: false

  deepseek:
    name: deepseek
    displayName: DeepSeek
    wire: openai
    baseUrl: "https://api.deepseek.com"
    keyEnv: DEEPSEEK_KEY
    auth:
      mode: env
      headerPrefix: "Bearer "
    features:
      supportsStreaming: true
      supportsToolUse: true
      supportsVision: false
      supportsCaching: true
      supportsThinking: true
      supportsJsonMode: true

  openrouter:
    name: openrouter
    displayName: OpenRouter
    wire: openai
    baseUrl: "https://openrouter.ai/api/v1"
    keyEnv: OPENROUTER_KEY
    auth:
      mode: env
      headerPrefix: "Bearer "
    headers:
      HTTP-Referer: "https://meridianos.dev"
      X-Title: "MeridianOS"
    features:
      supportsStreaming: true
      supportsToolUse: true
      supportsVision: true
      supportsCaching: false
      supportsThinking: false
      supportsJsonMode: true

  ollama:
    name: ollama
    displayName: Ollama (Local)
    wire: openai
    baseUrl: "http://localhost:11434/v1"
    keyEnv: null
    # Ollama runs whatever single local model the operator has pulled — same "one route for every
    # tier" pattern openrouter uses above. Override per-deployment via policy.yaml if a different
    # local model is pulled (see tests/ollama-e2e.test.mjs OLLAMA_E2E_MODEL for the test override).
    models:
      simple: "gemma4:e4b"
      medium: "gemma4:e4b"
      medium_high: "gemma4:e4b"
      complex: "gemma4:e4b"
      critical: "gemma4:e4b"
    auth:
      mode: env
    features:
      supportsStreaming: true
      supportsToolUse: true
      supportsVision: false
      supportsCaching: false
      supportsThinking: false
      supportsJsonMode: true
