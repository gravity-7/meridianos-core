    recovery_expectations: Reused or expired invitation is denied and no new membership is created.
    verification_method: HTTP RBAC contract and deterministic browser flow.
    owner: Collaboration quality owner
    expected_outcomes: Local-capture invitation is single-use and expired/reused invitations fail safely.
    verification_lanes: http-rbac; deterministic-browser
