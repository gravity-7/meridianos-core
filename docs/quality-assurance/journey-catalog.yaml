    synthetic_data_needs: Generated project, operator, task history, failure state, and escalation target.
    numbered_actions: 1 open assigned task; 2 run; 3 observe failure; 4 retry once; 5 escalate; 6 verify denial.
    recovery_expectations: Escalation records context; prohibited administrative action has no side effect.
    verification_method: Workflow domain contract, deterministic browser, keyboard, and wide/narrow visual evidence.
    owner: Workflow quality owner
    expected_outcomes: Operator can run allowed task actions, recover a deterministic failure, and escalate instead of bypassing policy.
    verification_lanes: domain-contract; deterministic-browser; keyboard; visual-wide-and-narrow
