# Canonical, dependency-free source of truth for persona-based QA.
# Normal runs are synthetic and loopback-only. See safe-fixture-design.md.
catalog_version: 1
default_classification: DETERMINISTIC-SIMULATED
personas:
  individual_first_time:
    label: First-time individual operator
    goal: Configure a safe local installation and reach a first bounded task.
    access: Local administrator during setup.
  individual_experienced:
    label: Experienced individual operator
    goal: Operate tasks and budgets without surprise spend or unsafe recovery.
    access: Local administrator.
  organization_admin:
    label: Organization administrator
    goal: Create projects and administer safe collaboration boundaries.
    access: Organization and project administrator.
  organization_operator:
    label: Organization operator
    goal: Execute assigned work, recover from safe failures, and escalate risks.
    access: Project operator.
  organization_viewer:
    label: Organization viewer
    goal: Observe approved work without gaining operational authority.
    access: Project viewer.
  integration_admin:
    label: Provider and integration administrator
    goal: Configure controlled provider, subscription, webhook, and reporting connections.
    access: Provider or platform administrator.
  desktop_admin:
    label: Desktop first-run administrator
    goal: Safely connect the desktop companion, local daemon, and dashboard.
    access: Local machine administrator.
fixture_profiles:
  fresh_solo:
    purpose: Empty temporary root for first-run setup.
    reset: Delete isolated temporary root after server close.
    dependency_mode: Loopback provider only.
    ai_traffic_path: test-gateway -> loopback-provider
    revision: fresh-solo-r1
  solo_byok:
    purpose: Configured individual workspace with a generated non-secret sentinel.
    reset: Recreate policy, task, usage, and ledger data from fixture manifest.
    dependency_mode: Loopback provider and test gateway only.
    ai_traffic_path: test-gateway -> loopback-provider
    revision: solo-byok-r1
  organization_roles:
    purpose: Two synthetic projects with admin, operator, and viewer memberships.
    reset: New isolated control-plane database and generated users per worker.
    dependency_mode: Local mail capture and deterministic task runner.
    ai_traffic_path: test-gateway -> loopback-provider
    revision: organization-roles-r1
  provider_failure:
    purpose: Configured provider route with controlled success and failure responses.
    reset: Restart local mock and recreate generated policy.
    dependency_mode: Loopback provider only.
    ai_traffic_path: test-gateway -> loopback-provider
    revision: provider-failure-r1
  billing_entitlement:
    purpose: Free and entitled organization states with local signed event data.
    reset: Recreate entitlement ledger and local webhook payloads.
    dependency_mode: In-memory payment webhook only.
    revision: billing-entitlement-r1
  desktop_first_run:
    purpose: Fake keychain, daemon, and provider state for desktop recovery.
    reset: Fresh temporary app-data root and fake keychain per run.
    dependency_mode: Local daemon and loopback provider only.
    ai_traffic_path: test-gateway -> loopback-provider
    revision: desktop-first-run-r1
dependency_scenarios:
  provider:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [quota, malformed-response]
  payment:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [free-gated, entitled, expired, local-webhook-invalid]
  email:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [local-capture, expired-invitation, reused-invitation, delivery-failure]
  webhook:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [accepted, denied, retryable-failure]
  subscription:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [configured-synthetic-session, acknowledgement-missing]
  browser_system:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [wide, narrow, keyboard-only, reduced-motion]
  desktop_system:
    required_variants: [success, validation-error, authorization-denied, timeout, unavailable]
    additional_variants: [local-keychain-locked]
journeys:
  JRN-001:
    title: First value through legacy setup and BYOK routing
    persona: individual_first_time
    priority: P1
    domains: onboarding; providers-models; budget-safety
    truth_state: CURRENT-LEGACY-COMPATIBILITY-BRIDGE
    implementation_surface: Existing `/setup`; `/app/setup` is not implemented or claimed.
    compatibility_bridge_target: Registered provider/model selection, one-time server validation, redacted review, and explicit first-write commit.
    canary_boundary: DeepSeek-only manual canary preparation is deferred to Phase 3; Z.ai GLM is unregistered and unsupported.
    fixture_profile: fresh_solo
    dependency_scenarios: provider; browser_system
    user_goal: Complete a safe first local configuration with a registered provider/model route.
    business_value: Gives a new individual a truthful route selection and review-before-write boundary instead of environment-key detection.
    risk_level: high
    preconditions: Empty root with no `.ai/policy.yaml`, `.ai/tenant.yaml`, or `.env`; the standard loopback fixture is Phase 2 work.
    synthetic_data_needs: Generated tenant, agents, budget, and provider sentinel for focused HTTP tests only.
    numbered_actions: 1 welcome; 2 agents; 3 provider validation; 4 budget; 5 review and explicit commit.
    recovery_expectations: A safe validation failure blocks review/commit; an existing setup target returns safely without overwrite. Controlled browser recovery evidence is Phase 2 work.
    verification_method: Phase 1 focused setup contract and HTTP tests; deterministic browser, keyboard, wide/narrow evidence, and fixture redaction scans are Phase 2 work.
    owner: Dashboard quality owner
    expected_outcomes: `/setup` exposes only registered provider/model metadata, review is redacted and non-writing, and an explicit matching commit writes a fresh root once.
    verification_lanes: unit-contract; http-contract; future-deterministic-browser
    browser_expectations: `/setup` compatibility bridge only; Phase 2 adds automated desktop/narrow/keyboard evidence
    browser_desktop: pending-phase-2
    browser_narrow: pending-phase-2
    browser_keyboard: pending-phase-2
    browser_recovery: pending-phase-2
    evidence_status: PHASE-2-PENDING
    review_status: REVIEWED-FOR-INTERNAL
    runbook: runbooks/JRN-001-first-value-byok.md
  JRN-002:
    title: Unified platform setup happy path and first task
    persona: individual_first_time
    priority: P2
    domains: onboarding; projects-tasks
    truth_state: PLANNED
    fixture_profile: fresh_solo
    dependency_scenarios: provider; browser_system
    user_goal: Complete the future unified setup and start a bounded first task.
    business_value: Defines future onboarding acceptance before the feature is implemented.
    risk_level: high
    preconditions: Planned /app/setup route and fresh temporary root.
    synthetic_data_needs: Generated tenant, agents, provider sentinel, budget, and task.
    numbered_actions: 1 begin setup; 2 configure; 3 validate; 4 review; 5 commit; 6 start task.
    recovery_expectations: Invalid or timed-out validation retains non-secret draft and blocks commit.
    verification_method: Specification contract followed by future deterministic browser automation.
    owner: Onboarding product owner
    expected_outcomes: Future /app/setup flow reaches a simulated first task without storing or displaying a secret.
    verification_lanes: specification-contract; future-deterministic-browser
    browser_expectations: /app/setup once implemented; resume and explicit commit states
    evidence_status: NOT-IMPLEMENTED
    review_status: DRAFT
    runbook: not-required
  JRN-003:
    title: Budget warning, halt, and safe resume
    persona: individual_experienced
    priority: P1
    domains: budget-safety; providers-models; projects-tasks
    truth_state: CURRENT-SIMULATED
    fixture_profile: solo_byok
    dependency_scenarios: provider; browser_system
    user_goal: Understand, trigger, and safely recover from a budget enforcement event.
    business_value: Proves spend guardrails are visible and cannot be bypassed by routine operator action.
    risk_level: critical
    preconditions: Generated ledger at a known threshold with test gateway enforcement enabled.
    synthetic_data_needs: Generated policy, model route, task, frozen clock, usage ledger, and administrator.
    numbered_actions: 1 inspect limit; 2 reach warning; 3 reach halt; 4 request permitted resume; 5 inspect ledger.
    recovery_expectations: Unauthorized or still-over-limit resume remains blocked and offers escalation.
    verification_method: Gateway/ledger contract plus deterministic browser and wide/narrow visual evidence.
    owner: Gateway quality owner
    expected_outcomes: Deterministic usage reaches warning and halt thresholds; a permitted administrator can resume safely.
    verification_lanes: unit-contract; deterministic-browser; gateway-ledger; visual-wide-and-narrow
    browser_expectations: Budget panel shows warning, halted state, reason, and controlled resume action
    browser_desktop: required
    browser_narrow: required
    browser_keyboard: required
    browser_recovery: required
    evidence_status: BLOCKED
    review_status: REVIEWED-FOR-INTERNAL
    runbook: runbooks/JRN-003-budget-safety.md
  JRN-004:
    title: Existing installation protection during setup
    persona: individual_first_time
    priority: P2
    domains: onboarding
    truth_state: CURRENT-SIMULATED
    fixture_profile: fresh_solo
    dependency_scenarios: browser_system
    user_goal: Avoid accidentally overwriting an existing installation during setup.
    business_value: Protects a user's prior local configuration from mistaken first-run actions.
    risk_level: high
    preconditions: Temporary root seeded with generated existing policy.
    synthetic_data_needs: Generated policy snapshot and setup-wizard state.
    numbered_actions: 1 detect any setup target; 2 show safe return action; 3 return to dashboard without overwrite.
    recovery_expectations: Return guarantees no change; the first-run bridge never provides an overwrite path.
    verification_method: Setup contract and deterministic browser path.
    owner: Setup quality owner
    expected_outcomes: Existing policy, tenant, or `.env` target is detected and left unchanged; setup cannot continue into an overwrite path.
    verification_lanes: unit-contract; deterministic-browser
    browser_expectations: /setup existing-configuration warning and cancel path
    evidence_status: PLANNED
    review_status: REVIEWED-FOR-INTERNAL
    runbook: not-required
  JRN-005:
    title: Project creation and team collaboration
    persona: organization_admin
    priority: P1
    domains: projects-tasks; access-control
    truth_state: CURRENT-SIMULATED
    fixture_profile: organization_roles
    dependency_scenarios: browser_system
    user_goal: Create a project and give each generated team member the appropriate scope.
    business_value: Proves project isolation and collaboration attribution for an organization.
    risk_level: critical
    preconditions: Isolated control-plane fixture with two generated projects and role memberships.
    synthetic_data_needs: Generated users, projects, memberships, task, and activity history.
    numbered_actions: 1 create project; 2 assign roles; 3 start allowed task; 4 inspect members; 5 inspect activity.
    recovery_expectations: Cross-project membership attempt is denied with both projects unchanged.
    verification_method: HTTP RBAC contract, deterministic browser, keyboard, and wide/narrow visual evidence.
    owner: Collaboration quality owner
    expected_outcomes: Admin creates isolated project state, grants synthetic membership, and sees attributable activity.
    verification_lanes: http-rbac; deterministic-browser; keyboard; visual-wide-and-narrow
    browser_expectations: Project creation, member list, role display, and activity attribution are visible
    browser_desktop: required
    browser_narrow: required
    browser_keyboard: required
    browser_recovery: required
    evidence_status: BLOCKED
    review_status: REVIEWED-FOR-INTERNAL
    runbook: runbooks/JRN-005-project-team.md
  JRN-006:
    title: Invitation acceptance and role change boundaries
