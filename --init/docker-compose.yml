# tenant123 — MeridianOS daemon + gateway
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f

services:
  daemon:
    image: ghcr.io/gravity-7/meridianos-core:latest
    entrypoint: ["node", "daemon-entry.mjs"]
    ports:
      - "4317:4317"
    environment:
      - AIOS_ROOT=/tenant
      - AIOS_DASHBOARD_PORT=4317
      - DEEPSEEK_KEY
      - ANTHROPIC_API_KEY
      - OPENROUTER_KEY
      - AIOS_DASH_TOKEN
      - AIOS_ESCALATION_WEBHOOK
    volumes:
      - ./:/tenant:ro
      - daemon-state:/tenant/.ai/state
      - daemon-gateway:/tenant/.ai/gateway
    restart: unless-stopped

  gateway:
    image: ghcr.io/gravity-7/meridianos-core:latest
    ports:
      - "8787:8787"
    environment:
      - DEEPSEEK_KEY
      - ANTHROPIC_API_KEY
      - OPENROUTER_KEY
    volumes:
      - gateway-ledger:/app/.ai/gateway
      - ./:/tenant:ro
    command:
      - "--port=8787"
      - "--tenant=tenant123"
      - "--ledger=/app/.ai/gateway/ledger.db"
      - "--policy=/tenant/.ai/policy.yaml"
      - "--provider=deepseek"
      - "--model=deepseek-chat"
    restart: unless-stopped

volumes:
  daemon-state:
  daemon-gateway:
  gateway-ledger:
